[project]
name = "hashmol3d"
version = "0.11.0"
description = "Library for deterministic 3D molecular geometry identifiers and hashes"
authors = [{name = "Murat Keçeli"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hashmol3d = "hashmol3d.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["gemini", "xyz", ".venv", ".git", "build", "dist"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["gemini", "xyz", "build", "dist"]

[tool.ruff.lint]
# Pyflakes (F), pycodestyle errors+warnings (E, W), isort (I),
# pyupgrade (UP), bugbear (B).
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # tolerate long lines in test fixtures
# Paper harnesses: sys.path setup precedes imports; compact one-liner style.
"paper/*" = ["E402", "E501", "E702", "E731"]
